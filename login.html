<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — UP API HUB</title>
  <link rel="icon" type="image/png" href="assets/logo-up.png" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --surface: #0c0c0c;
      --border: #242424;
      --text: #e8e8e8;
      --text-muted: #8a8a8a;
      --green: #2fd96a;
      --red: #f85149;
      --radius: 8px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* fundo pontilhado */
      background-image: radial-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(10, 10, 10, .92);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px 30px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .7);
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .brand img {
      height: 46px;
      filter: brightness(0) invert(1);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand h1 .g {
      color: var(--green);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }

    .field input {
      width: 100%;
      padding: 11px 13px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      transition: border-color .15s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--green);
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--green);
      color: #04210f;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: filter .15s, transform .12s;
    }

    .btn-submit:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      display: none;
    }

    .msg.err {
      display: block;
      background: rgba(248, 81, 73, .1);
      border: 1px solid rgba(248, 81, 73, .4);
      color: var(--red);
    }

    .msg.ok {
      display: block;
      background: rgba(47, 217, 106, .1);
      border: 1px solid rgba(47, 217, 106, .4);
      color: var(--green);
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .foot a {
      color: var(--green);
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .back:hover {
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo-up.png" alt="UP" />
      <h1><span class="g">UP</span> API <span class="g">HUB</span></h1>
    </div>

    <div class="msg" id="msg"></div>

    <form id="form-login" method="post" autocomplete="on">
      <div class="field">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required autofocus />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required />
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <p class="foot">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    <a class="back" href="index.html">← voltar ao hub</a>
  </div>

  <script src="config.js"></script>
  <script>
    const API_UP_URL = window.API_UP_URL;
    const form = document.getElementById("form-login");
    const msg = document.getElementById("msg");

    const btn = form.querySelector(".btn-submit");

    function mostrar(tipo, texto) {
      msg.className = "msg " + tipo;
      msg.textContent = texto;
    }

    // Mensagem de "conta criada" vinda do cadastro (?cadastro=ok)
    if (new URLSearchParams(location.search).get("cadastro") === "ok") {
      mostrar("ok", "Conta criada! Agora é só entrar.");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const usuario = form.usuario.value.trim();

      btn.disabled = true;
      btn.textContent = "Entrando…";

      try {
        // Valida a senha no backend da API-UP (PBKDF2). Sem credentials por
        // ora: a sessão por cookie fica pra quando hub e API-UP estiverem no
        // mesmo domínio (Cloudflare Tunnel). O backend redireciona: senha
        // certa → "/" (que, sem sessão, rebate pra "/login"); senha errada →
        // "/login?erro=1". Detectamos o resultado pela URL final.
        const resp = await fetch(API_UP_URL + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(new FormData(form)),
        });

        if ((resp.url || "").includes("erro")) {
          mostrar("err", "Usuário ou senha incorretos.");
          btn.disabled = false;
          btn.textContent = "Entrar";
          return;
        }

        // Sucesso → guarda o nome (dica de UI) e volta pro HUB logado.
        if (usuario) localStorage.setItem("up_name", usuario);
        location.href = "index.html";
      } catch (err) {
        mostrar(
          "err",
          "Não foi possível falar com a API-UP. Verifique se o servidor está " +
          "ligado e se você já aceitou o certificado abrindo " + API_UP_URL + " uma vez."
        );
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>

</html>
