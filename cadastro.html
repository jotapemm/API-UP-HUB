<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar-se — UP API HUB</title>
  <link rel="icon" type="image/png" href="assets/logo-up.png" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --border: #242424;
      --text: #e8e8e8;
      --text-muted: #8a8a8a;
      --green: #2fd96a;
      --red: #f85149;
      --radius: 8px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(10, 10, 10, .92);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 34px 32px 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .7);
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand img {
      height: 44px;
      filter: brightness(0) invert(1);
    }

    .brand h1 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand h1 .g {
      color: var(--green);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }

    .field input {
      width: 100%;
      padding: 10px 13px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      transition: border-color .15s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--green);
    }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--green);
      color: #04210f;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: filter .15s, transform .12s;
    }

    .btn-submit:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: .6;
      cursor: default;
      transform: none;
    }

    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      display: none;
    }

    .msg.err {
      display: block;
      background: rgba(248, 81, 73, .1);
      border: 1px solid rgba(248, 81, 73, .4);
      color: var(--red);
    }

    .msg.ok {
      display: block;
      background: rgba(47, 217, 106, .1);
      border: 1px solid rgba(47, 217, 106, .4);
      color: var(--green);
    }

    .foot {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .foot a {
      color: var(--green);
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .back:hover {
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo-up.png" alt="UP" />
      <h1>Criar conta</h1>
    </div>

    <div class="msg" id="msg"></div>

    <form id="form-cad" autocomplete="on">
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autofocus />
      </div>
      <div class="field">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required
          pattern="[A-Za-z0-9._-]{3,32}" />
        <div class="hint">3 a 32 caracteres — letras, números, ponto, hífen ou underline.</div>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required minlength="8" />
        <div class="hint">Mínimo de 8 caracteres.</div>
      </div>
      <div class="field">
        <label for="senha2">Confirmar senha</label>
        <input type="password" id="senha2" name="senha2" required minlength="8" />
      </div>
      <button type="submit" class="btn-submit" id="btn">Cadastrar</button>
    </form>

    <p class="foot">Já tem conta? <a href="login.html">Entrar</a></p>
    <a class="back" href="index.html">← voltar ao hub</a>
  </div>

  <script src="config.js"></script>
  <script>
    const API_UP_URL = window.API_UP_URL;
    const form = document.getElementById("form-cad");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    // Códigos de erro que o backend devolve via redirect ?erro=<cod>
    const ERROS = {
      campos: "Preencha todos os campos.",
      usuario: "Usuário inválido (3–32 caracteres: letras, números . _ -).",
      email: "E-mail inválido.",
      senha: "A senha precisa ter ao menos 8 caracteres.",
      confere: "As senhas não conferem.",
      existe: "Esse usuário já existe.",
    };

    function mostrar(tipo, texto) {
      msg.className = "msg " + tipo;
      msg.textContent = texto;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (form.senha.value !== form.senha2.value) {
        return mostrar("err", ERROS.confere);
      }

      btn.disabled = true;
      btn.textContent = "Cadastrando…";

      try {
        // POST no backend da API-UP. A senha é protegida lá com PBKDF2-SHA256.
        // O endpoint responde com redirect: sucesso → /login?cadastro=ok,
        // erro → /cadastro?erro=<cod>. Inspecionamos a URL final.
        const resp = await fetch(API_UP_URL + "/cadastro", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(new FormData(form)),
        });

        const url = resp.url || "";
        if (url.includes("cadastro=ok")) {
          mostrar("ok", "Conta criada com sucesso! Redirecionando…");
          setTimeout(() => location.href = "login.html?cadastro=ok", 1100);
        } else {
          const cod = (url.match(/erro=([a-z]+)/) || [])[1];
          mostrar("err", ERROS[cod] || "Não foi possível concluir o cadastro.");
          btn.disabled = false;
          btn.textContent = "Cadastrar";
        }
      } catch (err) {
        mostrar(
          "err",
          "Não foi possível falar com a API-UP. Verifique se o servidor está " +
          "ligado e se você já aceitou o certificado abrindo " + API_UP_URL + " uma vez."
        );
        btn.disabled = false;
        btn.textContent = "Cadastrar";
      }
    });
  </script>
</body>

</html>
