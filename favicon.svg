<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    /* logo embutido como forma preta; tema ESCURO -> inverte p/ branco */
    image { filter: invert(1); }
    /* tema CLARO -> mantem preto */
    @media (prefers-color-scheme: light) { image { filter: none; } }
  </style>
  <image width="128" height="128" href="data:image/png;base64,"/>
</svg>
