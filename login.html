<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — UP API HUB</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="assets/logo-up.png" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --surface: #0c0c0c;
      --border: #242424;
      --text: #e8e8e8;
      --text-muted: #7a7a7a;
      --green: #2fd96a;
      --red: #f85149;
      --radius: 8px;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* fundo pontilhado interativo (canvas), igual ao hero do hub */
    canvas#dots {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px 30px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .7);
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .brand img {
      height: 46px;
      filter: brightness(0) invert(1);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand h1 .g {
      color: var(--green);
    }

    .brand p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }

    .field input {
      width: 100%;
      padding: 11px 13px;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      transition: border-color .15s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--green);
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--green);
      color: #04210f;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: filter .15s, transform .12s;
    }

    .btn-submit:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      display: none;
    }

    .msg.err {
      display: block;
      background: rgba(248, 81, 73, .1);
      border: 1px solid rgba(248, 81, 73, .4);
      color: var(--red);
    }

    .msg.ok {
      display: block;
      background: rgba(47, 217, 106, .1);
      border: 1px solid rgba(47, 217, 106, .4);
      color: var(--green);
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .foot a {
      color: var(--green);
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .back:hover {
      color: var(--text);
    }
  </style>
</head>

<body>
  <canvas id="dots"></canvas>
  <div class="card">
    <div class="brand">
      <img src="assets/logo-up.png" alt="UP" />
      <h1><span class="g">UP</span> API <span class="g">HUB</span></h1>
      <p>Recuperação Tributária - acesso restrito</p>
    </div>

    <div class="msg" id="msg"></div>

    <form id="form-login" method="post" autocomplete="on">
      <!-- destinos de retorno (preenchidos via JS): sucesso → hub, erro → esta tela -->
      <input type="hidden" name="next" id="f-next" />
      <input type="hidden" name="next_err" id="f-next-err" />
      <div class="field">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required autofocus />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required />
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <p class="foot">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    <a class="back" href="index.html">← voltar ao hub</a>
  </div>

  <script src="config.js"></script>
  <script>
    const API_UP_URL = window.API_UP_URL;
    const form = document.getElementById("form-login");
    const msg = document.getElementById("msg");

    function mostrar(tipo, texto) {
      msg.className = "msg " + tipo;
      msg.textContent = texto;
    }

    // POST NATIVO (navegação) — é o único jeito de "passar" pelo certificado
    // self-signed da API-UP: o navegador mostra o aviso e você prossegue.
    // Um fetch invisível não consegue. Depois de validar (PBKDF2), a API-UP
    // redireciona de volta conforme os campos next/next_err:
    //   sucesso → next      = este hub (index)  + grava o cookie de sessão
    //   erro    → next_err  = esta tela de login (?erro=1)
    form.action = API_UP_URL + "/login";
    document.getElementById("f-next").value = new URL("index.html", location.href).href;
    document.getElementById("f-next-err").value = new URL("login.html", location.href).href;

    // Mensagens por querystring
    const params = new URLSearchParams(location.search);
    if (params.get("erro")) {
      // login falhou → desfaz a dica otimista e mostra o erro
      localStorage.removeItem("up_name");
      mostrar("err", "Usuário ou senha incorretos.");
    } else if (params.get("cadastro") === "ok") {
      mostrar("ok", "Conta criada! Agora é só entrar.");
    }

    // Guarda o nome (dica de UI) ANTES de navegar; se der erro, a tela de
    // login limpa de volta (acima). A segurança real continua sendo o cookie.
    form.addEventListener("submit", () => {
      const u = form.usuario.value.trim();
      if (u) localStorage.setItem("up_name", u);
    });
  </script>
  <script src="dots.js"></script>
</body>

</html>
