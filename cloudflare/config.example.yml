# ============================================================
#  Cloudflare Tunnel — config COMBINADA (HUB + API-UP + API-CONF)
#
#  Um único tunnel serve OS TRÊS serviços, cada um num subdomínio
#  do MESMO domínio. Mesmo domínio = "mesmo site" → o cookie de
#  sessão da API-UP é compartilhado com o HUB (login único).
#
#  COPIE para  C:\Users\UP\.cloudflared\config.yml  (ou para o
#  cloudflare\config.yml do tunnel) e preencha os <...>.
#  Pré-requisito: o tunnel já criado (API-UP\cloudflare\DEPLOY.md).
# ============================================================

tunnel: <TUNNEL_UUID>
credentials-file: C:\Users\UP\.cloudflared\<TUNNEL_UUID>.json

ingress:
  # ── HUB (site estático servido pelo start_hub.bat, porta 8090) ──
  # Local é HTTP mesmo; o HTTPS válido é o da borda do Cloudflare.
  - hostname: <hub.SEUDOMINIO.com.br>
    service: http://localhost:8090

  # ── API-UP (uvicorn HTTPS local, porta 8000) ────────────────────
  - hostname: <upapi.SEUDOMINIO.com.br>
    service: https://localhost:8000
    originRequest:
      noTLSVerify: true          # cert mkcert é self-signed no salto local
      httpHostHeader: <upapi.SEUDOMINIO.com.br>

  # ── API-CONF — conferência fiscal (porta 8010) ──────────────────
  # Hoje roda em HTTP local (API_CONF_URL no config.js). Se um dia a
  # CONF passar a rodar HTTPS (mkcert), troque para https://localhost:8010
  # e replique o bloco originRequest (noTLSVerify + httpHostHeader).
  - hostname: <conf.SEUDOMINIO.com.br>
    service: http://localhost:8010

  # ── API-CTRL-CRED — controle de crédito do SPED (porta 8100) ────
  # HTTP local (API_CTRL_URL no config.js). Se rodar HTTPS no futuro,
  # troque para https://localhost:8100 + bloco originRequest.
  - hostname: <ctrl.SEUDOMINIO.com.br>
    service: http://localhost:8100

  # ── Obrigatória: qualquer outra coisa → 404 ─────────────────────
  - service: http_status:404
